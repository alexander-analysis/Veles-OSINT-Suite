# VELES default configuration - thresholds, cadences and monitored assets.
# Runtime changes made through POST /api/admin/config are stored in
# settings.local.yaml (git-ignored) and merged over these defaults.
# Secrets (API keys) do NOT belong here - they live in .env.

market:
  assets: [BTC, ETH]
  exchanges: [binance, kraken, coinbase]
  # yfinance tickers: gold, WTI crude, Brent, Henry Hub gas, Dutch TTF gas, copper
  commodities: ["GC=F", "CL=F", "BZ=F", "NG=F", "TTF=F", "HG=F"]
  candle_timeframe: "1m"
  fetch_interval_seconds: 60
  analysis_interval_minutes: 5
  volatility_interval_minutes: 15
  # Price anomaly: deviation > N sigma from the rolling baseline
  price_anomaly_sigma: 3.0
  price_baseline_days: 7
  # Volume spike: volume > N x the 24h average
  volume_spike_multiplier: 2.0
  # Coordination: correlated move on 2+ exchanges inside the window
  coordination_window_seconds: 30
  coordination_min_correlation: 0.85
  coordination_min_move_percent: 2.0
  coordination_lookback_minutes: 60
  # Suppress repeat alerts of the same type for an asset/exchange unless severity rises
  alert_cooldown_minutes: 30
  # Binance futures liquidation stream -> cascade detection
  liquidations_enabled: true
  liquidation_gap_minutes: 2.0
  liquidation_min_events: 5
  liquidation_min_total_usd: 1000000

maritime:
  ais_poll_interval_seconds: 30
  # a global batch can take a couple of minutes to write on a Pi; polls are skipped while one is running
  ais_ingest_timeout_seconds: 300
  sanctions_check_interval_minutes: 15
  sanctions_refresh_hour_utc: 3
  port_data_refresh_hours: 6
  # AIS sources (see docs/DATA_SOURCES.md). Key-gated sources stay off until
  # their credential is present in .env even when enabled here.
  ais_sources:
    - { type: digitraffic, enabled: true }          # Baltic / Finland, no key
    - { type: aisstream, enabled: true }            # global, AISSTREAM_API_KEY
    - { type: marinetraffic, enabled: false }       # MARINETRAFFIC_API_KEY (+ optional bbox [min_lat, min_lon, max_lat, max_lon])
    - { type: ais_hub, enabled: false }             # AISHUB_USERNAME
    - { type: rtl_sdr, enabled: false, udp_port: 10110 }  # local rtl_ais / AIS-catcher NMEA over UDP
    - { type: nmea_tcp, enabled: false, host: 153.44.253.27, port: 5631, source: kystverket }  # Norwegian coast (open feed; blocked on some networks)
  max_position_age_minutes: 30
  # Position history: flagged/breach/risky vessels and slow vessels at sea (STS candidates) keep every fix;
  # everything else keeps one fix per N minutes (0 = current position only). Keeps global feeds affordable.
  history_interval_minutes: 60
  # slow vessels with a slow neighbour within ~1 km (possible rendezvous) keep a fix every N minutes
  history_slow_interval_minutes: 10
  history_risk_floor: 0.3
  # AIS ingest writes in chunks of N vessels per transaction with a short pause so other bots get the SQLite lock
  ingest_chunk_size: 600
  ingest_chunk_pause_seconds: 0.15
  transshipment_max_speed_knots: 1.5
  # Confidence thresholds (brief section 17)
  min_visible_confidence: 0.6
  review_queue_min_confidence: 0.4
  transshipment_proximity_meters: 500
  transshipment_min_duration_minutes: 30
  transshipment_cluster_limit: 8  # slow vessels within ~6 km that mark an anchorage / marina (pairs there need a typed tanker)
  transshipment_max_duration_hours: 48  # continuous contact beyond this is a berthed or laid-up pair, dismissed automatically
  ais_gap_threshold_hours: 6
  unusual_dwell_time_hours: 72

sanctions:
  # OFAC / EU / UN list refresh cadence (hours); lists are also loaded at first start
  refresh_interval_hours: 6
  refresh_on_startup: true
  # Re-screen recently active vessels this often (minutes)
  check_maritime_interval_minutes: 30
  # Weekly JSON activity report written to backend/reports/ (UTC, 0 = Monday)
  weekly_report_day: 0
  weekly_report_hour_utc: 9
  # Fuzzy vessel-name similarity floor (0-1)
  fuzzy_min_similarity: 0.9

geopolitical:
  # Geopolitical event monitor: GDELT 2.0 events (15-min exports), GDELT DOC topic
  # searches and official feeds (gov.uk FCDO, UN press, OFAC recent actions). All keyless.
  enabled: true
  gdelt_events_interval_minutes: 15
  # Keep GDELT events with at least this many media mentions (noise floor)
  gdelt_min_mentions: 8
  # GDELT events outside the watchlist countries need 2x the mentions to be kept and are stepped down one severity
  # watchlist_countries: [RU, UA, IR, ...]   (default: sanctions / conflict / flag-of-convenience states, see analysis/geopolitical.py)
  doc_interval_minutes: 30
  doc_timespan: 2h
  doc_max_records: 40
  doc_min_interval_seconds: 15
  # doc_topics: override the built-in topic queries (list of {query, event_type})
  official_feeds_interval_minutes: 30
  # official_feeds: override the built-in feeds (list of {name, url, type, reliability, enabled})
  correlation_interval_minutes: 10
  # Signals inside +/- N hours of an event are candidates for correlation
  correlation_window_hours: 24
  correlation_min_severity: medium
  min_correlation_score: 0.55
  max_correlations_per_event: 40  # strongest links kept per event and run
  # Instant notification (webhook / e-mail) for new events at or above this severity
  alert_min_severity: critical

blockchain:
  # Blockchain tracker: OFAC digital-currency addresses (Bitcoin / Ethereum / Tron) watched through
  # keyless public APIs (Blockstream, PublicNode RPC, Tronscan) plus whale detection.
  enabled: true
  poll_interval_minutes: 10
  # Addresses polled per run (Blockstream / Tronscan are rate-limited; Ethereum is one batched RPC call)
  poll_batch_bitcoin: 12
  poll_batch_tron: 6
  # Ethereum: sample the newest block every N seconds (~0.7 MB) for whales; sanctioned / mixer stablecoin
  # flows are queried with topic filters over every block since the last scan (complete coverage)
  ethereum_scan_enabled: true
  ethereum_scan_interval_seconds: 180
  ethereum_max_catchup_blocks: 40
  # Real-time Bitcoin unconfirmed-transaction stream (blockchain.com): whales + sanctioned-address hits
  bitcoin_stream_enabled: true
  whale_min_btc: 100
  whale_min_eth: 1000
  whale_min_usd: 5000000

corporate:
  # Corporate intelligence: sanctioned companies and vessel owners are enriched through GLEIF
  # (LEI records, parents, subsidiaries) in rotation; SEC EDGAR adds SIC / CIK for US entities.
  enabled: true
  enrich_interval_minutes: 10
  # Companies looked up per run (each costs 1-5 GLEIF calls at ~1 request/s)
  enrich_batch: 40
  reenrich_days: 30
  # Name similarity (legal-form suffixes stripped) required to attach an LEI to a listed name
  min_name_similarity: 0.9
  max_children: 50
  edgar_enabled: true

energy:
  # Energy flow monitor: curated terminals / refineries / STS anchorages (app/data/energy_facilities.py),
  # tanker visits and shipments reconstructed from AIS port calls and draught changes, dark-oil indicators.
  enabled: true
  visit_interval_minutes: 5
  # a tanker inside a facility radius at or below this speed opens a facility visit
  visit_max_speed_knots: 1.5
  shipment_interval_minutes: 15
  dark_oil_interval_minutes: 15
  dark_oil_lookback_days: 30
  # loitering in an STS anchorage longer than this raises an indicator
  sts_loiter_hours: 24
  snapshot_interval_minutes: 60
  snapshot_days: 35

correlation:
  # Cross-bot correlation engine: signals from every bot inside the window are matched on shared
  # vessels / listed parties / wallets / companies / facilities / countries / assets; clusters spanning
  # min_domains bot domains become composite alerts.
  enabled: true
  interval_minutes: 5
  window_hours: 48
  min_pair_score: 0.45
  min_domains: 3

aviation:
  # Sanctioned airframes (OFAC aircraft listings) swept on adsb.lol by registration; learned Mode S codes
  # polled in batches (adsb.lol + anonymous OpenSky, ~300 calls/day budget).
  enabled: true
  sweep_interval_minutes: 15
  sweep_batch: 120
  hex_poll_interval_minutes: 5
  opensky_daily_budget: 300

leaks:
  # ransomware.live victim postings + HIBP breach catalogue matched against tracked companies, sectors and keywords
  enabled: true
  interval_minutes: 60
  ransomware_live_enabled: true
  hibp_enabled: true
  min_store_score: 0.5
  watch_keywords: [maritime, shipping, port, tanker, oil, gas, pipeline, bank, crypto, exchange, ministry, defence, defense]

narratives:
  # State-media headline clustering (RT / TASS / Global Times from the geopolitical feeds)
  enabled: true
  interval_minutes: 30
  window_hours: 36
  min_items: 3

infra:
  # Domains from OFAC "Website" remarks: RDAP, DNS, hosting ASN / country, certificate transparency
  enabled: true
  interval_minutes: 20
  batch: 15
  recheck_days: 14

psc:
  # Port State Control: Paris MoU current detentions + bans (THETIS), Tokyo MoU monthly detention list (APCIS)
  enabled: true
  interval_hours: 6
  paris_enabled: true
  tokyo_enabled: true

legal:
  # OFAC civil penalties, DOJ press releases (sanctions keywords), CourtListener dockets naming listed parties
  enabled: true
  official_interval_hours: 6
  courtlistener_enabled: true
  docket_interval_minutes: 30
  courtlistener_batch: 8

retention:
  market_candles_days: 90
  blockchain_transactions_days: 90
  # ecosystem tables (purged daily at purge_hour_utc; matched / suspect rows are kept)
  signal_correlations_days: 30
  composite_alerts_days: 180
  aircraft_sightings_days: 90
  breach_events_days: 180
  narratives_days: 90
  legal_events_days: 365
  energy_days: 180
  geopolitical_events_days: 90
  # Global AIS produces a few million position rows per day before sampling;
  # 30 days + thinning keeps the SQLite file in the low gigabytes on a Pi.
  vessel_positions_days: 30
  vessel_positions_compress_after_days: 3
  vessel_positions_compress_interval_minutes: 30
  purge_hour_utc: 2

notifications:
  # Instant alerts (webhook / e-mail) for events at or above min_severity, plus a daily digest.
  # Channels activate when NOTIFY_WEBHOOK_URL / SMTP_* are present in .env.
  enabled: false
  min_severity: high
  webhook_enabled: true
  email_enabled: true
  email_to: []
  digest_enabled: true
  digest_hour_utc: 7

classification:
  banner: UNCLASSIFIED
