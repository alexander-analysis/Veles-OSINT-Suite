# VELES reverse proxy - /etc/nginx/sites-available/veles
#
# Serves the built frontend and forwards /api/* (including the WebSocket
# stream) to the FastAPI service on 127.0.0.1:8000.  HTTPS is terminated by
# Cloudflare Tunnel, so this listens on plain HTTP.

upstream veles_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Built frontend (copied here by pi-setup.sh - /home is not readable by nginx)
    root /var/www/veles/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # WebSocket stream (most specific prefix wins)
    location /api/maritime/stream {
        proxy_pass http://veles_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST API + OpenAPI docs
    location ~ ^/(api|docs|openapi\.json|redoc) {
        proxy_pass http://veles_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
